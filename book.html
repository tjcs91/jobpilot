<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book — JobPilot</title><style>
:root{--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--line:#dbe4ee;--accent:#22b8f0}. *{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);margin:0}.wrap{max-width:690px;margin:28px auto;padding:18px}.brand{font-size:23px;font-weight:950;letter-spacing:-.5px}.brand span{color:#0b9bd2}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-top:14px;box-shadow:0 15px 45px rgba(2,8,23,.06)}.eyebrow{font-size:12px;font-weight:900;color:#0b7ba7}.muted{color:var(--muted);line-height:1.5}.field{margin-bottom:13px}.field label{display:block;font-weight:900;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--accent);color:#062235;font-weight:900;cursor:pointer;width:100%}.success{padding:16px;border-radius:12px;background:#ecfdf3;color:#166534}.error{padding:12px;border-radius:10px;background:#fef2f2;color:#b42318}.serviceInfo{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.small{font-size:12px}@media(max-width:650px){.wrap{margin:6px auto}.grid{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body><div class="wrap"><div class="brand">JobPilot <span>AI</span></div><div id="box" class="card"><div id="loading">Loading booking page…</div><div id="content" style="display:none"><div class="eyebrow">ONLINE BOOKING</div><h1 id="biz" style="margin:6px 0 5px">Book a service</h1><p id="sub" class="muted"></p><div id="servicePreview"></div><hr style="border:0;border-top:1px solid #e5e7eb;margin:20px 0"><div id="form"><div class="field"><label>Name</label><input id="name" autocomplete="name"></div><div class="grid"><div class="field"><label>Phone</label><input id="phone" type="tel" autocomplete="tel"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div></div><div class="field"><label>Vehicle</label><input id="vehicle" placeholder="BMW 3 Series, black"></div><div class="field"><label>Service</label><select id="service"></select></div><div class="grid"><div class="field"><label>Preferred date</label><input id="date" type="date"></div><div class="field"><label>Preferred time</label><input id="time" type="time" value="10:00"></div></div><div class="field"><label>Address</label><textarea id="address" rows="3" placeholder="Where should we attend?"></textarea></div><div class="field"><label>Notes</label><textarea id="notes" rows="3" placeholder="Anything we should know about the vehicle?"></textarea></div><button class="btn" onclick="book()">Request my booking</button><p class="small muted" style="margin-top:10px">Your request is not final until the business confirms the appointment.</p></div><div id="result" style="margin-top:14px"></div></div></div></div><script>
const slug=location.pathname.split('/').pop();const $=id=>document.getElementById(id);let svc=[],business;async function load(){try{const r=await fetch('/api/public/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error(d.error||'Business not found');business=d.business;svc=d.services;$('biz').textContent=business.name;$('sub').textContent=business.intro||'Choose a service and send your preferred time. We will confirm the appointment with you.';$('service').innerHTML=svc.map(s=>`<option value="${s.id}">${s.name} — £${(s.pricePence/100).toFixed(2)} · ${s.durationMin} mins</option>`).join('');$('servicePreview').innerHTML=svc.slice(0,4).map(s=>`<div class="serviceInfo"><div><b>${s.name}</b><div class="small muted">${s.durationMin} minutes</div></div><b>£${(s.pricePence/100).toFixed(2)}</b></div>`).join('');$('date').value=new Date().toISOString().slice(0,10);$('loading').style.display='none';$('content').style.display='block'}catch(e){$('loading').innerHTML='<div class="error">'+e.message+'</div>'}}
async function book(){const body={name:$('name').value,phone:$('phone').value,email:$('email').value,vehicleDetails:$('vehicle').value,serviceId:$('service').value,date:$('date').value,time:$('time').value,address:$('address').value,notes:$('notes').value};try{const r=await fetch('/api/public/'+encodeURIComponent(slug)+'/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to request booking');$('form').innerHTML='';$('servicePreview').style.display='none';$('result').innerHTML='<div class="success"><b>Booking request received.</b><br><br>Thanks! '+business.name+' now has your request and can confirm the appointment with you.</div>'}catch(e){$('result').innerHTML='<div class="error">'+e.message+'</div>'}}
load();</script></body></html>
